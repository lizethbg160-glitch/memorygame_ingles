<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Byte Quest Memory</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
/* VOICE: playful 8-bit arcade, loud but tidy, built for a classroom
   IDEA: a retro platformer cartridge — the board is a level, cards are blocks
   PICTURE: the card grid itself, set in a pixel world with hills and clouds
   COLOUR and TYPE: teal sky, coral bricks-free ground, gold accent; Press Start 2P + VT323
   LAYOUT: arcade HUD on top, board centered, toast and win screen overlay */
:root{color-scheme:light dark;--sky1:#2fb3c4;--sky2:#9fe6dc;--ink:#1b1830;--gold:#ffc93c;--coral:#ff6b4a;--grass:#3fae4f;--grass2:#2c8a3c;--sand:#e9a35a;--sand2:#c97c38;--card:#2d2a5a;--card2:#4a46a0;--paper:#fff8e7}
:root[data-theme=dark]{--sky1:#13234a;--sky2:#2b5f86}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--sky1:#13234a;--sky2:#2b5f86}}
*{box-sizing:border-box;min-width:0}
body{margin:0;min-height:100vh;color:var(--ink);font:20px/1.3 "VT323",monospace;overflow-x:clip;
 background:linear-gradient(var(--sky1),var(--sky2) 70%);position:relative}
.world{position:fixed;inset:0;pointer-events:none;z-index:0}
.world svg{position:absolute;left:0;bottom:0;width:100%;height:220px}
.cloud{position:absolute;image-rendering:pixelated;opacity:.95;animation:drift 60s linear infinite}
@keyframes drift{from{transform:translateX(-10vw)}to{transform:translateX(110vw)}}
@media(prefers-reduced-motion:reduce){.cloud{animation:none}.inner{transition:none!important}}
main{position:relative;z-index:1;max-width:1100px;margin:0 auto;padding:18px max(3vw,10px) 240px}
h1{font:clamp(18px,3.6vw,32px)/1.25 "Press Start 2P",monospace;color:var(--gold);margin:6px 0 4px;text-align:center;
 text-shadow:3px 3px 0 var(--ink),-2px -2px 0 var(--ink),2px -2px 0 var(--ink),-2px 2px 0 var(--ink);text-wrap:balance}
.sub{text-align:center;color:#fff;margin:0 0 14px;text-shadow:2px 2px 0 var(--ink)}
.hud{display:flex;flex-wrap:wrap;justify-content:center;gap:8px 22px;background:var(--ink);color:#fff;border:4px solid #fff;
 box-shadow:0 0 0 4px var(--ink),6px 6px 0 4px rgba(0,0,0,.35);padding:10px 14px;margin:0 auto 14px;max-width:760px;font:12px/1.6 "Press Start 2P",monospace}
.hud b{display:block;color:var(--gold);font-size:14px;font-weight:400}
.hud div{text-align:center}
.bar{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-bottom:16px}
button{font:11px/1 "Press Start 2P",monospace;min-height:44px;padding:0 14px;border:0;cursor:pointer;color:var(--ink);background:var(--paper);
 box-shadow:inset -4px -4px 0 rgba(0,0,0,.25),0 0 0 3px var(--ink),4px 4px 0 3px rgba(0,0,0,.3)}
button:hover{background:#fff}button:active{transform:translate(2px,2px)}
button[aria-pressed=true]{background:var(--gold)}
button:focus-visible,.card:focus-visible{outline:3px dashed #fff;outline-offset:4px}
.board{display:grid;gap:10px;grid-template-columns:repeat(var(--cols,8),minmax(0,1fr));max-width:var(--maxw,960px);margin:0 auto}
@media(max-width:700px){.board{--cols:5!important;gap:7px}}
@media(max-width:380px){.board{--cols:4!important}}
.card{aspect-ratio:3/4;perspective:700px;cursor:pointer;border:0;padding:0;background:none;box-shadow:none;min-height:0}
.card:active{transform:none}
.inner{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .45s steps(6)}
.card.up .inner,.card.done .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;display:grid;place-items:center;
 box-shadow:inset -5px -5px 0 rgba(0,0,0,.28),inset 5px 5px 0 rgba(255,255,255,.25),0 0 0 3px var(--ink),4px 4px 0 3px rgba(0,0,0,.3)}
.back{background:var(--card);background-image:repeating-linear-gradient(45deg,transparent 0 8px,rgba(255,255,255,.06) 8px 16px)}
.back svg{width:56%;image-rendering:pixelated}
.front{transform:rotateY(180deg);background:var(--paper);padding:6px;text-align:center}
.front svg{width:72%;max-height:78%;shape-rendering:crispEdges}
.front.word span{font:clamp(8px,1.25vw,12px)/1.5 "Press Start 2P",monospace;color:var(--ink);overflow-wrap:anywhere}
.front.word{background:#fff1c9}
.card.done .front{background:#c9f2c2;animation:pop .4s steps(3)}
@keyframes pop{50%{transform:rotateY(180deg) scale(1.08)}}
.card.miss .front{background:#ffd0c4}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(140%);z-index:5;background:var(--ink);color:#fff;
 border:4px solid #fff;padding:10px 18px;font:12px/1.6 "Press Start 2P",monospace;text-align:center;transition:transform .25s;max-width:92vw}
.toast.show{transform:translateX(-50%) translateY(0)}
.toast i{font-style:normal;color:var(--gold)}
.overlay{position:fixed;inset:0;z-index:6;display:none;place-items:center;background:rgba(27,24,48,.72);padding:16px}
.overlay.show{display:grid}
.panel{background:var(--paper);max-width:520px;width:100%;padding:22px;text-align:center;
 box-shadow:0 0 0 4px var(--ink),0 0 0 8px #fff,0 0 0 12px var(--ink)}
.panel h2{font:clamp(16px,3vw,22px)/1.4 "Press Start 2P",monospace;color:var(--coral);margin:4px 0 12px}
.stars{font:28px "Press Start 2P",monospace;color:var(--gold);text-shadow:2px 2px 0 var(--ink);letter-spacing:6px;margin:8px 0}
.panel ul{columns:2;text-align:left;padding-left:18px;margin:12px 0;font-size:19px}
.panel li b{font-weight:400;color:var(--card2)}
.found{max-width:960px;margin:22px auto 0;background:rgba(255,248,231,.92);padding:12px 16px;box-shadow:0 0 0 3px var(--ink)}
.found h3{font:11px "Press Start 2P",monospace;margin:4px 0 8px}
.found p{margin:0;color:#555}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips span{background:#c9f2c2;padding:2px 8px;box-shadow:0 0 0 2px var(--ink)}
</style>
</head>
<body>
<div class="world" aria-hidden="true">
 <svg viewBox="0 0 1200 220" preserveAspectRatio="none" shape-rendering="crispEdges">
  <path fill="var(--grass2)" d="M0 120h80v-20h40v-20h60v20h40v20h120v-40h40v-20h80v20h40v40h140v-30h50v-20h70v20h50v30h120v-40h60v-20h60v20h40v40h60V220H0z"/>
  <rect y="150" width="1200" height="14" fill="var(--grass)"/>
  <rect y="164" width="1200" height="56" fill="var(--sand)"/>
  <path fill="var(--sand2)" d="M0 184h1200v6H0zM0 204h1200v6H0z"/>
 </svg>
</div>
<main>
 <h1>BYTE QUEST MEMORY</h1>
 <p class="sub">Match each English word with its picture. Computer vocabulary!</p>
 <div class="hud" role="status">
  <div>WORLD<b id="hLevel">1-1</b></div>
  <div>PAIRS<b id="hPairs">0/10</b></div>
  <div>MOVES<b id="hMoves">0</b></div>
  <div>TIME<b id="hTime">0:00</b></div>
  <div>BEST<b id="hBest">--</b></div>
 </div>
 <div class="bar">
  <button id="lv1" aria-pressed="true">EASY · 10 PAIRS</button>
  <button id="lv2" aria-pressed="false">FULL · 20 PAIRS</button>
  <button id="restart">RESTART</button>
  <button id="sound" aria-pressed="true">SOUND ON</button>
 </div>
 <div class="board" id="board"></div>
 <section class="found">
  <h3>WORDS FOUND</h3>
  <div class="chips" id="chips"><p>Flip two cards. Find the word and the picture that go together.</p></div>
 </section>
</main>
<div class="toast" id="toast"></div>
<div class="overlay" id="win" role="dialog" aria-modal="true" aria-labelledby="winT">
 <div class="panel">
  <h2 id="winT">LEVEL CLEAR!</h2>
  <div class="stars" id="stars">★★★</div>
  <p id="winTxt"></p>
  <ul id="winList"></ul>
  <button id="again">PLAY AGAIN</button>
 </div>
</div>
<script>
{
const P={a:'#1b1830',c:'#fff8e7',w:'#ffffff'};
const W=[
 {en:'Computer',es:'Computadora',b:'#3fb6e8',px:['..........','.aaaaaaaa.','.abbbbbba.','.abbcbbbba','.abbbbbba.','.aaaaaaaa.','aaaaaaaaaa','acacacacaa','aaaaaaaaaa']},
 {en:'Keyboard',es:'Teclado',b:'#7a73d6',px:['aaaaaaaaaaaa','acacacacacaa','aaaaaaaaaaaa','acacacacacaa','aaaaaaaaaaaa','aacccccccaaa','aaaaaaaaaaaa']},
 {en:'Mouse',es:'Ratón',b:'#ff6b4a',px:['....a.....','....a.....','..aaaaaa..','.aacabcaa.','.accaacca.','.aaaaaaaa.','.acccccca.','.acccccca.','..acccca..','...aaaa...']},
 {en:'Screen / Monitor',es:'Pantalla / Monitor',b:'#3fb6e8',px:['aaaaaaaaaa','abbbbbbbba','abccbbbbba','abcbbbbbba','abbbbbbbba','aaaaaaaaaa','....aa....','...aaaa...','..aaaaaa..']},
 {en:'Printer',es:'Impresora',b:'#ffc93c',px:['..cccccc..','..cccccc..','aaaaaaaaaa','aaaaaaabaa','aaaaaaaaaa','a.cccccc.a','..caaaac..','..cccccc..']},
 {en:'Server',es:'Servidor',b:'#3fae4f',px:['aaaaaaaaaa','acccccccba','aaaaaaaaaa','acccccccba','aaaaaaaaaa','acccccccba','aaaaaaaaaa','..a....a..']},
 {en:'Database',es:'Base de datos',b:'#ffc93c',px:['..aaaaaa..','.acccccca.','.aaaaaaaa.','.abbbbbba.','.aaaaaaaa.','.abbbbbba.','.aaaaaaaa.','.abbbbbba.','..aaaaaa..']},
 {en:'Software',es:'Software (programas)',b:'#b48cf2',px:['...aaaa...','.aabbbbaa.','.abbccbba.','abbcaacbba','abca..acba','abca..acba','abbcaacbba','.abbccbba.','.aabbbbaa.','...aaaa...']},
 {en:'Hardware',es:'Hardware (equipo físico)',b:'#8a8fa3',px:['....bb....','.b.bbbb.b.','..bbbbbb..','.bbb..bbb.','bbb....bbb','bbb....bbb','.bbb..bbb.','..bbbbbb..','.b.bbbb.b.','....bb....']},
 {en:'Password',es:'Contraseña',b:'#ffc93c',px:['.bbbb.....','bb..bb....','b....bbbbb','bb..bb.b.b','.bbbb..b.b']},
 {en:'Cloud',es:'Nube',b:'#9fe6dc',px:['...aaa....','..acccaa..','.acccccca.','acccccccca','acccccccca','.aaaaaaaa.']},
 {en:'Network',es:'Red',b:'#ff6b4a',px:['...aaaa...','...abba...','...aaaa...','....aa....','..aaaaaa..','..a....a..','aaaa..aaaa','abba..abba','aaaa..aaaa']},
 {en:'Internet',es:'Internet',b:'#3fb6e8',px:['...aaaa...','.aabbbbaa.','.abccbbba.','abcccbbbba','abbccbbcba','abbbbbccba','.abbbbcba.','.aabbbbaa.','...aaaa...']},
 {en:'Virus',es:'Virus',b:'#3fae4f',px:['..a.aa.a..','...aaaa...','.aabbbbaa.','..abcbba..','aaabbbbaaa','..abbcba..','.aabbbbaa.','...aaaa...','..a.aa.a..']},
 {en:'File',es:'Archivo',b:'#7a73d6',px:['.aaaaaa...','.accccaa..','.acccccaa.','.abbbbbca.','.acccccca.','.abbbbbca.','.acccccca.','.abbbbbca.','.acccccca.','.aaaaaaaa.']},
 {en:'Download',es:'Descargar',b:'#3fae4f',px:['....bb....','....bb....','....bb....','..bbbbbb..','...bbbb...','....bb....','a........a','aaaaaaaaaa']},
 {en:'Upload',es:'Subir (cargar)',b:'#ff6b4a',px:['....bb....','...bbbb...','..bbbbbb..','....bb....','....bb....','....bb....','a........a','aaaaaaaaaa']},
 {en:'User',es:'Usuario',b:'#ff6b4a',px:['...aaaa...','..accccа..'.replace('а','a'),'..acccca..','...aaaa...','..........','.abbbbbba.','abbbbbbbba','abbbbbbbba']},
 {en:'Website',es:'Sitio web',b:'#ffc93c',px:['aaaaaaaaaa','abacacaaaa','aaaaaaaaaa','acccccccca','acbbbbccca','acccccccca','acbbbcbbca','acccccccca','aaaaaaaaaa']},
 {en:'App',es:'Aplicación',b:'#b48cf2',px:['..aaaaaa..','..acccca..','..abcbca..','..acccca..','..abcbca..','..acccca..','..aaaaaa..','..aaccaa..','..aaaaaa..']}
];
const icon=(w)=>{const h=w.px.length,wd=Math.max(...w.px.map(r=>r.length));let r='';
 w.px.forEach((row,y)=>[...row].forEach((ch,x)=>{if(ch==='.')return;const f=ch==='b'?w.b:(P[ch]||P.a);r+=`<rect x="${x}" y="${y}" width="1.02" height="1.02" fill="${f}"/>`}));
 return `<svg viewBox="-1 -1 ${wd+2} ${h+2}" aria-hidden="true">${r}</svg>`};
const backArt=`<svg viewBox="0 0 12 12" shape-rendering="crispEdges" aria-hidden="true"><path fill="#ffc93c" d="M3 1h6v1h1v1h1v6h-1v1h-1v1H3v-1H2V9H1V3h1V2h1z"/><path fill="#1b1830" d="M4 3h4v6H4z"/><path fill="#ffc93c" d="M5 4h2v1H5zM5 6h2v2H5z"/><path fill="#fff" d="M3 2h2v1H3zM2 3h1v2H2z"/></svg>`;
const $=id=>document.getElementById(id);
const board=$('board'),toast=$('toast');
let pairs=10,deck=[],open=[],lock=false,moves=0,found=[],t0=0,tick=null,snd=true,actx=null;
const beep=(f,d=.08,type='square')=>{if(!snd)return;try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();const o=actx.createOscillator(),g=actx.createGain();o.type=type;o.frequency.value=f;g.gain.value=.06;o.connect(g);g.connect(actx.destination);const n=actx.currentTime;g.gain.exponentialRampToValueAtTime(.0001,n+d);o.start(n);o.stop(n+d)}catch(e){}};
const tune=(notes,step=.09)=>notes.forEach((f,i)=>setTimeout(()=>beep(f,.12),i*step*1000));
const bestKey=()=>'bqm-best-'+pairs;
const getBest=()=>{try{return JSON.parse(localStorage.getItem(bestKey()))}catch(e){return null}};
const fmt=s=>Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function hud(){$('hPairs').textContent=found.length+'/'+pairs;$('hMoves').textContent=moves;$('hLevel').textContent=pairs===10?'1-1':'1-2';
 const b=getBest();$('hBest').textContent=b?b.moves+' mv':'--'}
function start(){
 clearInterval(tick);tick=null;t0=0;$('hTime').textContent='0:00';
 moves=0;found=[];open=[];lock=false;
 const words=shuffle(W.map((w,i)=>i)).slice(0,pairs);
 deck=shuffle(words.flatMap(i=>[{i,k:'w'},{i,k:'p'}]));
 board.style.setProperty('--cols',pairs===10?5:8);board.style.setProperty('--maxw',pairs===10?'640px':'960px');
 board.innerHTML=deck.map((c,n)=>{const w=W[c.i];const front=c.k==='w'?`<div class="face front word"><span>${w.en}</span></div>`:`<div class="face front">${icon(w)}</div>`;
  return `<button class="card" data-n="${n}" aria-label="Hidden card ${n+1}"><div class="inner"><div class="face back">${backArt}</div>${front}</div></button>`}).join('');
 $('chips').innerHTML='<p>Flip two cards. Find the word and the picture that go together.</p>';
 hud();
}
function say(html){toast.innerHTML=html;toast.classList.add('show');clearTimeout(say.t);say.t=setTimeout(()=>toast.classList.remove('show'),2200)}
function flip(el){
 const n=+el.dataset.n,c=deck[n];
 if(lock||el.classList.contains('up')||el.classList.contains('done'))return;
 if(!tick){t0=Date.now();tick=setInterval(()=>$('hTime').textContent=fmt(Math.round((Date.now()-t0)/1000)),1000)}
 el.classList.add('up');el.setAttribute('aria-label',c.k==='w'?W[c.i].en:'Picture of '+W[c.i].en);beep(c.k==='w'?520:660);
 open.push(el);if(open.length<2)return;
 moves++;lock=true;const [a,b]=open;const ca=deck[a.dataset.n],cb=deck[b.dataset.n];
 if(ca.i===cb.i&&ca.k!==cb.k){
  setTimeout(()=>{a.classList.add('done');b.classList.add('done');open=[];lock=false;found.push(ca.i);tune([660,880,1320]);
   const w=W[ca.i];say(`${w.en.toUpperCase()} = <i>${w.es}</i>`);
   $('chips').innerHTML=found.map(i=>`<span>${W[i].en} — ${W[i].es}</span>`).join('');hud();
   if(found.length===pairs)win()},250);
 }else{
  a.classList.add('miss');b.classList.add('miss');beep(160,.18,'triangle');
  setTimeout(()=>{[a,b].forEach(x=>{x.classList.remove('up','miss');x.setAttribute('aria-label','Hidden card '+(+x.dataset.n+1))});open=[];lock=false},900)
 }
 hud();
}
function win(){
 clearInterval(tick);tick=null;const secs=Math.round((Date.now()-t0)/1000);
 const ratio=moves/pairs,st=ratio<=1.6?3:ratio<=2.4?2:1;
 $('stars').textContent='★'.repeat(st)+'☆'.repeat(3-st);
 const b=getBest();let rec='';
 if(!b||moves<b.moves){try{localStorage.setItem(bestKey(),JSON.stringify({moves,secs}))}catch(e){}rec=' New best score!'}
 $('winTxt').textContent=`You found all ${pairs} pairs in ${moves} moves and ${fmt(secs)}.${rec}`;
 $('winList').innerHTML=found.map(i=>`<li>${W[i].en} — <b>${W[i].es}</b></li>`).join('');
 $('win').classList.add('show');tune([523,659,784,1047,784,1047],.12);hud();$('again').focus();
}
board.addEventListener('click',e=>{const el=e.target.closest('.card');if(el)flip(el)});
const setLv=p=>{pairs=p;$('lv1').setAttribute('aria-pressed',p===10);$('lv2').setAttribute('aria-pressed',p===20);start()};
$('lv1').onclick=()=>setLv(10);$('lv2').onclick=()=>setLv(20);
$('restart').onclick=start;
$('again').onclick=()=>{$('win').classList.remove('show');start()};
$('sound').onclick=e=>{snd=!snd;e.currentTarget.textContent=snd?'SOUND ON':'SOUND OFF';e.currentTarget.setAttribute('aria-pressed',snd)};
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('win').classList.contains('show')){$('win').classList.remove('show')}});
const world=document.querySelector('.world');
const cloudSvg=`<svg viewBox="0 0 16 7" width="128" height="56" shape-rendering="crispEdges"><path fill="#fff" d="M5 0h4v1h2v1h2v1h2v3h-1v1H1V6H0V4h1V3h2V1h2z"/><path fill="#d6f2ee" d="M1 6h14v1H1z"/></svg>`;
[[8,-0],[22,-20],[38,-40]].forEach(([top,delay],k)=>{const d=document.createElement('div');d.className='cloud';d.style.top=top+'%';d.style.animationDelay=delay+'s';d.style.animationDuration=(60+k*15)+'s';d.innerHTML=cloudSvg;world.appendChild(d)});
start();
}
</script>
</body>
</html>
